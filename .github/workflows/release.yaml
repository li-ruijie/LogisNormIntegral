# Publish a GitHub release with an installable source tarball whenever the package
# version in DESCRIPTION changes on main (or on manual dispatch). The release asset
# LogisNormIntegral_<version>.tar.gz installs in R with
#   install.packages("<asset-url>", repos = NULL, type = "source")
# Actions are pinned to commit SHAs. Dependabot (.github/dependabot.yml) keeps them current.

on:
  push:
    branches: [main]
    paths: ['DESCRIPTION']
  workflow_dispatch:

name: release

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check-release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//' | tr -d '[:space:]')
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::Version ${version} is not a release version, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::Release ${tag} already exists, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: steps.gate.outputs.proceed == 'true'

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: steps.gate.outputs.proceed == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: steps.gate.outputs.proceed == 'true'
        with:
          needs: check

      - name: Build source tarball
        if: steps.gate.outputs.proceed == 'true'
        run: R CMD build .

      - name: Assert tarball has no .github
        if: steps.gate.outputs.proceed == 'true'
        run: |
          tarball=$(ls LogisNormIntegral_*.tar.gz)
          if tar -tzf "${tarball}" | grep -Eq '(^|/)\.github(/|$)'; then
            echo "::error::${tarball} contains .github; add '^\.github$' to .Rbuildignore."
            exit 1
          fi

      - name: Publish release
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          tarball=$(ls LogisNormIntegral_*.tar.gz)
          NOTES="LogisNormIntegral ${VERSION}. Install in R with "
          NOTES="${NOTES}remotes::install_github('li-ruijie/LogisNormIntegral@${TAG}'), "
          NOTES="${NOTES}or download ${tarball} and install.packages(..., repos = NULL, "
          NOTES="${NOTES}type = 'source')."
          gh release create "${TAG}" "${tarball}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes "${NOTES}"
